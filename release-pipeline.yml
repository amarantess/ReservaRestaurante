trigger:
- master


variables:
  dockerRegistryServiceConnection: '05a745f8-2788-48a9-833b-eb85d52c2a34'
  imageRepository: 'apireservarestaurante'
  containerRegistry: 'apireservarestaurante.azurecr.io'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'
  
pool:
      vmImage: 'ubuntu-latest'

steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          lasted
          $(tag)layName: Build
    
    
